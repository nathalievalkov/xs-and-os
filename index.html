<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xs &amp; Os</title>
<meta name="description" content="Tic tac toe against a friend or the computer.">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column — scoreboard, square board drawn as pen strokes, controls beneath. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #6b7684;
  --grid: #c9d1da;
  --x: #2f5bd3;
  --o: #d9480f;
  --win: #1b2430;
  --font-display: "Bricolage Grotesque", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --surface: #1a2029; --ink: #e6ebf1; --muted: #8b96a5;
    --grid: #343e4b; --x: #7d9dff; --o: #ff8a4c; --win: #e6ebf1; color-scheme: dark;
  }
}

* { -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  box-sizing: border-box;
  user-select: none;
}
main {
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
h1 .x { color: var(--x); } h1 .o { color: var(--o); }

.modes { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--grid); border-radius: 999px; padding: 3px; }
.modes button {
  font: 500 0.8rem var(--font-mono); color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 8px 11px; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tally {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 6px; border-radius: 12px; border: 2px solid transparent;
  transition: border-color .2s;
}
.tally .label { font: 500 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tally .n { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tally.x .n { color: var(--x); } .tally.o .n { color: var(--o); }
.tally.turn.x { border-color: var(--x); } .tally.turn.o { border-color: var(--o); }

.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
.board {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
}
.cell {
  position: relative; background: none; border: 0; padding: 12%; cursor: pointer;
  border-radius: 0; color: inherit; touch-action: manipulation;
}
.cell:nth-child(-n+6) { border-bottom: 3px solid var(--grid); }
.cell:not(:nth-child(3n)) { border-right: 3px solid var(--grid); }
.cell:disabled { cursor: default; }
.cell:focus-visible { outline: 3px solid var(--x); outline-offset: -6px; }
@media (hover: hover) { .cell:not(:disabled):hover .ghost { opacity: .18; } }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cell path, .cell circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.mark-x path { stroke: var(--x); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .22s ease-out forwards; }
.mark-x path:nth-child(2) { animation-delay: .14s; }
.mark-o circle { stroke: var(--o); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .35s ease-out forwards; }
.ghost { opacity: 0; transition: opacity .15s; }
.ghost path { stroke: var(--x); } .ghost circle { stroke: var(--o); }
.cell.dim svg { opacity: .3; transition: opacity .3s; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.strike { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
.strike line {
  stroke: var(--win); stroke-width: 1.6; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .4s .25s ease-out forwards;
}

.status { min-height: 1.6em; margin: 0; text-align: center; font-size: 1.15rem; font-weight: 500; }
.status b { font-weight: 800; }
.status .x { color: var(--x); } .status .o { color: var(--o); }

.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  font: 500 0.88rem var(--font-mono); padding: 12px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--grid); background: var(--surface); color: var(--ink); touch-action: manipulation;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:focus-visible, .modes button:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }
.hint { text-align: center; font: 400 0.75rem var(--font-mono); color: var(--muted); margin: 0; }
@media (hover: none) { .hint .keys { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .mark-x path, .mark-o circle, .strike line { animation: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="x">X</span>s &amp; <span class="o">O</span>s</h1>
    <div class="modes" role="group" aria-label="Opponent">
      <button id="mode-friend" data-mode="friend">2 players</button>
      <button id="mode-easy" data-mode="easy">CPU easy</button>
      <button id="mode-hard" data-mode="hard">CPU hard</button>
    </div>
  </header>

  <section class="score" aria-label="Score">
    <div class="tally x" id="tally-x"><span class="label" id="label-x">X</span><span class="n" id="score-x">0</span></div>
    <div class="tally"><span class="label">Draws</span><span class="n" id="score-d">0</span></div>
    <div class="tally o" id="tally-o"><span class="label" id="label-o">O</span><span class="n" id="score-o">0</span></div>
  </section>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Board"></div>
    <svg class="strike" id="strike" viewBox="0 0 3 3" aria-hidden="true"></svg>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="actions">
    <button class="btn primary" id="next">New round</button>
    <button class="btn" id="reset">Reset score</button>
  </div>
  <p class="hint"><span class="keys">Tip: press keys 1–9 to play (top-left is 1). </span>Loser starts the next round.</p>
</main>

<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const X_SVG = '<svg viewBox="0 0 100 100" class="mark-x"><path pathLength="100" d="M20 20 L80 80"/><path pathLength="100" d="M80 20 L20 80"/></svg>';
const O_SVG = '<svg viewBox="0 0 100 100" class="mark-o"><circle pathLength="100" cx="50" cy="50" r="32" transform="rotate(-90 50 50)"/></svg>';
const ghost = p => p === 'X'
  ? '<svg viewBox="0 0 100 100" class="ghost"><path d="M20 20 L80 80"/><path d="M80 20 L20 80"/></svg>'
  : '<svg viewBox="0 0 100 100" class="ghost"><circle cx="50" cy="50" r="32"/></svg>';
const STORE_KEY = 'xs-and-os';

let S;
const $ = id => document.getElementById(id);

function freshState(prev) {
  return {
    mode: prev?.mode ?? 'hard',
    score: prev?.score ?? { X: 0, O: 0, D: 0 },
    starter: prev?.starter ?? 'X',
    board: Array(9).fill(null),
    turn: prev?.starter ?? 'X',
    result: null // { winner: 'X'|'O'|null, line: [..] }
  };
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s?.board?.length === 9 ? s : null; } catch { return null; }
}

function check(b) {
  for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { winner: b[l[0]], line: l };
  return b.every(Boolean) ? { winner: null, line: null } : null;
}

// Minimax with depth so the CPU prefers faster wins and slower losses.
function minimax(b, player, me, depth) {
  const r = check(b);
  if (r) return { score: r.winner === me ? 10 - depth : r.winner ? depth - 10 : 0 };
  const other = player === 'X' ? 'O' : 'X';
  let best = { score: player === me ? -Infinity : Infinity, move: -1 };
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = player;
    const { score } = minimax(b, other, me, depth + 1);
    b[i] = null;
    if (player === me ? score > best.score : score < best.score) best = { score, move: i };
  }
  return best;
}

function cpuMove() {
  const empty = S.board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  // Easy: random most of the time, but grabs an immediate win.
  if (S.mode === 'easy' && Math.random() < 0.75) {
    for (const i of empty) { const b = S.board.slice(); b[i] = 'O'; if (check(b)?.winner === 'O') return i; }
    return empty[Math.floor(Math.random() * empty.length)];
  }
  if (empty.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
  return minimax(S.board.slice(), 'O', 'O', 0).move;
}

const vsCpu = () => S.mode !== 'friend';
const cpuTurn = () => vsCpu() && S.turn === 'O' && !S.result;
const scheduleCpu = delay => { if (cpuTurn()) setTimeout(() => { if (cpuTurn()) play(cpuMove()); }, delay); };

function play(i) {
  if (S.result || S.board[i]) return;
  S.board[i] = S.turn;
  const r = check(S.board);
  if (r) {
    S.result = r;
    if (r.winner) { S.score[r.winner]++; S.starter = r.winner === 'X' ? 'O' : 'X'; }
    else { S.score.D++; S.starter = S.starter === 'X' ? 'O' : 'X'; }
    navigator.vibrate?.(r.winner ? [30, 60, 30] : 40);
  } else {
    S.turn = S.turn === 'X' ? 'O' : 'X';
  }
  save();
  render(i);
  scheduleCpu(420);
}

function render(justPlayed) {
  const board = $('board');
  if (board.children.length !== 9) {
    board.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('button');
      c.className = 'cell'; c.id = 'cell-' + i; c.setAttribute('role', 'gridcell');
      c.addEventListener('click', () => { if (!cpuTurn()) play(i); });
      board.appendChild(c);
    }
  }
  [...board.children].forEach((c, i) => {
    const v = S.board[i];
    const want = v ? v : (S.result || cpuTurn() ? '' : 'g' + S.turn);
    if (c.dataset.v !== want || justPlayed === undefined) {
      c.innerHTML = v === 'X' ? X_SVG : v === 'O' ? O_SVG : want ? ghost(S.turn) : '';
      c.dataset.v = want;
    }
    c.disabled = !!v || !!S.result || cpuTurn();
    c.classList.toggle('dim', !!(S.result?.line && v && !S.result.line.includes(i)));
    c.setAttribute('aria-label', `Square ${i + 1}: ${v ?? 'empty'}`);
  });

  const strike = $('strike');
  if (S.result?.line) {
    const [a, , c] = S.result.line;
    const pt = k => [k % 3 + 0.5, Math.floor(k / 3) + 0.5];
    let [x1, y1] = pt(a), [x2, y2] = pt(c);
    const dx = (x2 - x1) * 0.18, dy = (y2 - y1) * 0.18;
    if (!strike.firstChild) strike.innerHTML = `<line pathLength="1" x1="${x1 - dx}" y1="${y1 - dy}" x2="${x2 + dx}" y2="${y2 + dy}"/>`;
  } else strike.innerHTML = '';

  $('label-x').textContent = vsCpu() ? 'You · X' : 'X';
  $('label-o').textContent = vsCpu() ? 'CPU · O' : 'O';
  $('score-x').textContent = S.score.X;
  $('score-o').textContent = S.score.O;
  $('score-d').textContent = S.score.D;
  $('tally-x').classList.toggle('turn', !S.result && S.turn === 'X');
  $('tally-o').classList.toggle('turn', !S.result && S.turn === 'O');

  const mark = p => `<b class="${p.toLowerCase()}">${p}</b>`;
  let msg;
  if (S.result?.winner) msg = vsCpu() ? (S.result.winner === 'X' ? `You win with ${mark('X')}` : `CPU wins with ${mark('O')}`) : `${mark(S.result.winner)} wins`;
  else if (S.result) msg = "It's a draw";
  else if (cpuTurn()) msg = 'CPU is thinking…';
  else msg = vsCpu() ? `Your move ${mark('X')}` : `${mark(S.turn)} to move`;
  $('status').innerHTML = msg;

  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  $('next').textContent = S.result ? 'Next round' : 'Restart round';
}

function newRound() {
  S = freshState(S);
  save();
  $('strike').innerHTML = '';
  $('board').innerHTML = '';
  render();
  scheduleCpu(500);
}

document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  if (S.mode === b.dataset.mode) return;
  S.mode = b.dataset.mode; S.score = { X: 0, O: 0, D: 0 }; S.starter = 'X';
  newRound();
}));
$('next').addEventListener('click', newRound);
$('reset').addEventListener('click', () => { S.score = { X: 0, O: 0, D: 0 }; S.starter = 'X'; newRound(); });
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9' && !e.ctrlKey && !e.metaKey && !e.altKey && !cpuTurn()) play(+e.key - 1);
  else if ((e.key === 'n' || e.key === 'N') && S.result) newRound();
});

S = load() ?? freshState();
render();
scheduleCpu(500);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
